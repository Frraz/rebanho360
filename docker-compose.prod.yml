# Produção. VPS compartilhado — ver docs/arquitetura/02-infra-e-deploy.md.
# Nginx do host já existe e faz proxy_pass para 127.0.0.1:${WEB_HOST_PORT:-8010}
# (a porta vem do .env; mude WEB_HOST_PORT se a 8010 estiver ocupada no VPS).
services:
  web:
    build:
      context: ./backend
      dockerfile: ../docker/web/Dockerfile
      target: prod
    image: rebanho360_web:latest
    container_name: rebanho360_web
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - rebanho360_media:/app/media
      - rebanho360_static:/app/staticfiles
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2304M   # 3× os 768M anteriores (9 workers gunicorn, ver gunicorn.conf.py)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: rebanho360_web:latest
    container_name: rebanho360_worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=6
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - rebanho360_media:/app/media
    deploy:
      resources:
        limits:
          memory: 1536M   # 3× os 512M anteriores (6 tarefas em paralelo: PDFs, exportações)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: rebanho360_web:latest
    container_name: rebanho360_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    deploy:
      resources:
        limits:
          memory: 768M    # 3× os 256M anteriores
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rebanho360_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Ajuste de memória e de custo de consulta para o limite de 3 GB abaixo. Os
    # valores seguem a regra de bolso do PostgreSQL: shared_buffers ≈ 25% da RAM
    # do contêiner e effective_cache_size ≈ 2/3. Mudar exige reiniciar o `db`.
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1          # disco SSD
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=3GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - jit=off                       # JIT atrasa consulta curta e de dashboard
      - -c
      - log_min_duration_statement=500   # loga consulta com mais de 500 ms
      - -c
      - shared_preload_libraries=pg_stat_statements
    shm_size: 1gb
    volumes:
      - rebanho360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 3G      # 3× o 1G anterior
    # Sem "ports": só acessível na rede interna do Docker.

  redis:
    image: redis:7-alpine
    container_name: rebanho360_redis
    restart: unless-stopped
    # É a fila do Celery: nunca descartar mensagem (noeviction); o teto fica
    # abaixo do limite do contêiner para sobrar memória para a persistência.
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - rebanho360_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M    # 3× os 256M anteriores
    # Sem "ports": só acessível na rede interna do Docker.

volumes:
  rebanho360_pgdata:
  rebanho360_media:
  rebanho360_static:
  rebanho360_redis:
