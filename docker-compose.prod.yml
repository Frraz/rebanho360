# Produção. VPS compartilhado — ver docs/arquitetura/02-infra-e-deploy.md.
# Nginx do host já existe e faz proxy_pass para 127.0.0.1:8010.
services:
  web:
    build:
      context: ./backend
      dockerfile: ../docker/web/Dockerfile
      target: prod
    image: rebanho360_web:latest
    container_name: rebanho360_web
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - rebanho360_media:/app/media
      - rebanho360_static:/app/staticfiles
    ports:
      - "127.0.0.1:8010:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: rebanho360_web:latest
    container_name: rebanho360_worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - rebanho360_media:/app/media
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: rebanho360_web:latest
    container_name: rebanho360_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rebanho360_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rebanho360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
    # Sem "ports": só acessível na rede interna do Docker.

  redis:
    image: redis:7-alpine
    container_name: rebanho360_redis
    restart: unless-stopped
    volumes:
      - rebanho360_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    # Sem "ports": só acessível na rede interna do Docker.

volumes:
  rebanho360_pgdata:
  rebanho360_media:
  rebanho360_static:
  rebanho360_redis:
